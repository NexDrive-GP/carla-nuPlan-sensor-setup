notes:
- LIDAR_MERGED points_per_second capped 1,861,358 -> 1,860,000 (--lidar-pps-cap) to keep the ray-casting cheap.
- 'LIDAR_MERGED: the 5 physical LiDARs are represented by ONE ray_cast sensor at the --lidar-mount; 40 ch, [-25, +15] deg, 360 deg (paper Table
  VII top Pandar40P); points_per_second from fit (sum of 5 LiDARs, measured). Bumper and A-pillar viewpoints / near-field blind spots are NOT
  modelled; CARLA spaces channels uniformly (real Pandar40P: denser near the horizon); rays with no hit are dropped.'
- 'principal point is not at the image centre (CARLA cannot model that, ignored; --compensate-principal-point approximates it by a rotation):
  CAM_F0 (+0,+20) px, CAM_L0 (+0,+20) px, CAM_L1 (+0,+20) px, CAM_L2 (+0,+20) px, CAM_R0 (+0,+20) px, CAM_R1 (+0,+20) px, CAM_R2 (+0,+20) px,
  CAM_B0 (+0,+20) px'
- z raised by 0.325 m (lidar fit ground_z_m = -0.32500000000001306) so heights are above the road.
- 'x/y/z shift in the CARLA frame: [-1.461, 0.0, 0.325] (rear axle -> CARLA vehicle origin, plus road level). The CARLA Pacifica body differs
  slightly from the real car: check that the sensors sit on the body.'
- 'Lens distortion: the OpenCV k1,k2,p1,p2,k3 model is not exported. CARLA''s RGB camera has lens_k / lens_kcube / lens_x_size / lens_y_size /
  lens_circle_* (a different model, no verified mapping), settable via --lens-k / --lens-kcube. The nominal k1 = -0.356 is strong barrel distortion:
  either undistort the dataset images before comparing, or accept a pinhole mismatch towards the image borders.'
